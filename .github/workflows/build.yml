name: Build

# PR1 CI: compiles the feature branch in the cloud (no local Android SDK needed)
# and runs the unit tests. The APK is kept as an artifact for on-phone testing.
on:
  push:
    branches: ["feature/transition-card"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (API 37)
        run: |
          chmod +x ci/setup-sdk.sh
          bash -x ci/setup-sdk.sh
          SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        # Always: the APK is the deliverable for on-phone testing, even when
        # flaky live-network tests fail (YouTube bot-blocks datacenter IPs;
        # see CONTRIBUTING.md). The job status still reflects the tests.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prism-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
