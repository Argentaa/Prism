name: Build

# PR1 CI: compiles the feature branch in the cloud (no local Android SDK needed)
# and runs the unit tests. The APK is kept as an artifact for on-phone testing.
on:
  push:
    branches: ["feature/transition-card"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK + run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-debug
          path: app/build/outputs/apk/debug/*.apk
