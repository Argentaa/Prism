name: Build

# PR1 CI: compiles the feature branch in the cloud (no local Android SDK needed)
# and runs the unit tests. The APK is kept as an artifact for on-phone testing.
on:
  push:
    branches: ["feature/transition-card"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (API 37)
        run: |
          chmod +x ci/setup-sdk.sh
          bash -x ci/setup-sdk.sh > /tmp/sdk-setup.log 2>&1
          SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK + run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish setup log for debugging
        if: always()
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@example.com"
          git checkout -B ci-debug-logs
          cp /tmp/sdk-setup.log ./sdk-setup.log
          git add sdk-setup.log
          git commit -m "CI SDK setup log" || true
          git push -f origin ci-debug-logs || true
